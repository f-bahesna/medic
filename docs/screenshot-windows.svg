<svg xmlns="http://www.w3.org/2000/svg" width="1034" height="1316" viewBox="0 0 1034 1316" role="img" aria-label="Example storage-doctor output on Windows, with sample data">
<rect width="1034" height="1316" rx="8" fill="#0c0c0c"/>
<rect width="1034" height="34" rx="8" fill="#202020"/>
<rect y="26" width="1034" height="8" fill="#202020"/>
<rect x="8" y="6" width="190" height="28" rx="6" fill="#0c0c0c"/>
<rect x="18" y="14" width="12" height="12" rx="2" fill="none" stroke="#3a96dd" stroke-width="1.5"/>
<path d="M21 17 l3 3 -3 3" fill="none" stroke="#3a96dd" stroke-width="1.5"/>
<text x="38" y="24" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12" fill="#ffffff">Windows PowerShell</text>
<path d="M918 17 h10" stroke="#cccccc" stroke-width="1"/>
<rect x="963" y="12" width="10" height="10" fill="none" stroke="#cccccc" stroke-width="1"/>
<path d="M1008 12 l10 10 M1018 12 l-10 10" stroke="#cccccc" stroke-width="1"/>
<text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Cascadia Mono', monospace" font-size="13" fill="#cccccc" xml:space="preserve">
<tspan x="20" y="58"><tspan fill="#cccccc">PS C:\Users\alex&gt; </tspan>powershell -ExecutionPolicy Bypass -File .\storage-doctor.ps1</tspan>
<tspan x="20" y="94">storage-doctor 0.2.0<tspan fill="#767676"> - DESKTOP-7K2M4QX, Microsoft Windows 11 Pro 10.0.26100</tspan></tspan>
<tspan x="20" y="112"><tspan fill="#767676">  Read-only scan. Nothing is deleted unless you run -Clean and confirm.</tspan></tspan>
<tspan x="20" y="148"><tspan fill="#3a96dd">Disk</tspan></tspan>
<tspan x="20" y="166"><tspan fill="#767676">------------------------------------------------------------</tspan></tspan>
<tspan x="20" y="184">  C: (system drive)</tspan>
<tspan x="20" y="202">    Capacity             475.8 GB</tspan>
<tspan x="20" y="220">    Used                 412.3 GB   <tspan fill="#c19c00">[#########################.....]</tspan> 86%</tspan>
<tspan x="20" y="238">    Free                 63.5 GB</tspan>
<tspan x="20" y="256">  D: Data</tspan>
<tspan x="20" y="274">    Capacity             931.5 GB</tspan>
<tspan x="20" y="292">    Used                 288.1 GB   <tspan fill="#16c60c">[#########.....................]</tspan> 30%</tspan>
<tspan x="20" y="310">    Free                 643.4 GB</tspan>
<tspan x="20" y="346"><tspan fill="#3a96dd">Memory (RAM)</tspan></tspan>
<tspan x="20" y="364"><tspan fill="#767676">------------------------------------------------------------</tspan></tspan>
<tspan x="20" y="382">  Physical memory        16.0 GB</tspan>
<tspan x="20" y="400">  In use                 10.9 GB    <tspan fill="#16c60c">[####################..........]</tspan> 68%</tspan>
<tspan x="20" y="418">    Compressed           1.4 GB</tspan>
<tspan x="20" y="436">  Cached                 4.2 GB<tspan fill="#767676"> (freed instantly when apps need it)</tspan></tspan>
<tspan x="20" y="454">  Available              5.1 GB</tspan>
<tspan x="20" y="472">  Committed              14.6 GB of 34.9 GB<tspan fill="#767676"> (41%, RAM + page file)</tspan></tspan>
<tspan x="20" y="490">  Page file used         1.1 GB of 18.9 GB</tspan>
<tspan x="20" y="508">  Memory pressure        <tspan fill="#16c60c">Normal</tspan><tspan fill="#767676"> (31% available)</tspan></tspan>
<tspan x="20" y="544">  Top apps by memory<tspan fill="#767676"> (working set, approximate)</tspan></tspan>
<tspan x="20" y="562">    2.7 GB     chrome<tspan fill="#767676"> (31 processes)</tspan></tspan>
<tspan x="20" y="580">    1.3 GB     Code<tspan fill="#767676"> (11 processes)</tspan></tspan>
<tspan x="20" y="598">    1.1 GB     svchost<tspan fill="#767676"> (94 processes)</tspan></tspan>
<tspan x="20" y="616">    986 MB     ms-teams<tspan fill="#767676"> (4 processes)</tspan></tspan>
<tspan x="20" y="634">    604 MB     explorer</tspan>
<tspan x="20" y="652">    433 MB     Discord<tspan fill="#767676"> (6 processes)</tspan></tspan>
<tspan x="20" y="670"><tspan fill="#767676">  High "in use" memory is normal. Only memory pressure tells you if RAM is a problem.</tspan></tspan>
<tspan x="20" y="706"><tspan fill="#3a96dd">Space hogs</tspan></tspan>
<tspan x="20" y="724"><tspan fill="#767676">------------------------------------------------------------</tspan></tspan>
<tspan x="20" y="742"><tspan fill="#767676">  SIZE       SAFETY   WHAT</tspan></tspan>
<tspan x="20" y="760">  41.2 GB    <tspan fill="#e74856">REVIEW </tspan><tspan font-weight="normal" fill="#cccccc">  WSL Linux distros</tspan></tspan>
<tspan x="20" y="778"><tspan fill="#767676">                      Your Linux files. 'wsl --unregister &lt;name&gt;' removes an unused distro and everything in it.</tspan></tspan>
<tspan x="20" y="796"><tspan fill="#767676">                      ~\AppData\Local\Packages\CanonicalGroupLimited.Ubuntu_79rhkp1fndgsc\LocalState\ext4.vhdx</tspan></tspan>
<tspan x="20" y="814">  12.6 GB    <tspan fill="#16c60c">SAFE   </tspan><tspan font-weight="normal" fill="#cccccc">  Browser caches (Chrome, Edge, Brave, Firefox)</tspan></tspan>
<tspan x="20" y="832"><tspan fill="#767676">                      Web page caches. Close the browser before cleaning.</tspan></tspan>
<tspan x="20" y="850"><tspan fill="#767676">                      ~\AppData\Local\Google\Chrome\User Data\Default\Cache</tspan></tspan>
<tspan x="20" y="868">  8.4 GB     <tspan fill="#16c60c">SAFE   </tspan><tspan font-weight="normal" fill="#cccccc">  Temporary files</tspan></tspan>
<tspan x="20" y="886"><tspan fill="#767676">                      Leftovers from installers and apps. Files still in use are skipped.</tspan></tspan>
<tspan x="20" y="904"><tspan fill="#767676">                      ~\AppData\Local\Temp</tspan></tspan>
<tspan x="20" y="922">  6.9 GB     <tspan fill="#c19c00">CAUTION</tspan><tspan font-weight="normal" fill="#cccccc">  Docker Desktop data</tspan></tspan>
<tspan x="20" y="940"><tspan fill="#767676">                      Clean runs 'docker system prune': stopped containers, dangling images, build cache. Volumes are kept.</tspan></tspan>
<tspan x="20" y="958"><tspan fill="#767676">                      ~\AppData\Local\Docker\wsl</tspan></tspan>
<tspan x="20" y="976">  3.8 GB     <tspan fill="#e74856">REVIEW </tspan><tspan font-weight="normal" fill="#cccccc">  Downloads folder</tspan></tspan>
<tspan x="20" y="994"><tspan fill="#767676">                      Your files. Sort by size in Explorer and remove what you no longer need.</tspan></tspan>
<tspan x="20" y="1012"><tspan fill="#767676">                      ~\Downloads</tspan></tspan>
<tspan x="20" y="1030">  2.2 GB     <tspan fill="#16c60c">SAFE   </tspan><tspan font-weight="normal" fill="#cccccc">  npm cache</tspan></tspan>
<tspan x="20" y="1048"><tspan fill="#767676">                      Packages are downloaded again when needed.</tspan></tspan>
<tspan x="20" y="1066"><tspan fill="#767676">                      ~\AppData\Local\npm-cache</tspan></tspan>
<tspan x="20" y="1084">  1.7 GB     <tspan fill="#c19c00">CAUTION</tspan><tspan font-weight="normal" fill="#cccccc">  Installer files (9 .msi/.iso/setup.exe)</tspan></tspan>
<tspan x="20" y="1102"><tspan fill="#767676">                      Rarely needed after installing. Clean moves them to the Recycle Bin, so it can be undone.</tspan></tspan>
<tspan x="20" y="1120"><tspan fill="#767676">  Run as administrator to also measure system caches (Windows Update, crash dumps, Windows.old).</tspan></tspan>
<tspan x="20" y="1156"><tspan fill="#3a96dd">Summary</tspan></tspan>
<tspan x="20" y="1174"><tspan fill="#767676">------------------------------------------------------------</tspan></tspan>
<tspan x="20" y="1192">  <tspan fill="#16c60c">SAFE   </tspan><tspan font-weight="normal" fill="#cccccc">  23.2 GB   </tspan> regenerated automatically, no data loss</tspan>
<tspan x="20" y="1210">  <tspan fill="#c19c00">CAUTION</tspan><tspan font-weight="normal" fill="#cccccc">  8.6 GB    </tspan> regenerable, read the note first</tspan>
<tspan x="20" y="1228">  <tspan fill="#e74856">REVIEW </tspan><tspan font-weight="normal" fill="#cccccc">  45.0 GB   </tspan> your data, check by hand (never cleaned by storage-doctor)</tspan>
<tspan x="20" y="1264">  Run again with -Clean to clean SAFE and CAUTION items (asks for each one),</tspan>
<tspan x="20" y="1282">  or with -DryRun to preview without changing anything.</tspan>
</text></svg>

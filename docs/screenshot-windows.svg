<svg xmlns="http://www.w3.org/2000/svg" width="1034" height="2036" viewBox="0 0 1034 2036" role="img" aria-label="Example medic output on Windows, with sample data">
<rect width="1034" height="2036" rx="8" fill="#0c0c0c"/>
<rect width="1034" height="34" rx="8" fill="#202020"/>
<rect y="26" width="1034" height="8" fill="#202020"/>
<rect x="8" y="6" width="190" height="28" rx="6" fill="#0c0c0c"/>
<rect x="18" y="14" width="12" height="12" rx="2" fill="none" stroke="#3a96dd" stroke-width="1.5"/>
<path d="M21 17 l3 3 -3 3" fill="none" stroke="#3a96dd" stroke-width="1.5"/>
<text x="38" y="24" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12" fill="#ffffff">Windows PowerShell</text>
<path d="M918 17 h10" stroke="#cccccc" stroke-width="1"/>
<rect x="963" y="12" width="10" height="10" fill="none" stroke="#cccccc" stroke-width="1"/>
<path d="M1008 12 l10 10 M1018 12 l-10 10" stroke="#cccccc" stroke-width="1"/>
<text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Cascadia Mono', monospace" font-size="13" fill="#cccccc" xml:space="preserve">
<tspan x="20" y="58"><tspan fill="#cccccc">PS C:\Users\alex&gt; </tspan>medic --quick</tspan>
<tspan x="20" y="94"><tspan fill="#cccccc" font-weight="bold">medic 0.5.0</tspan> <tspan fill="#767676">- DESKTOP-7K2M4QX, Microsoft Windows 11 Pro 10.0.26100</tspan></tspan>
<tspan x="20" y="112">  <tspan fill="#767676">Read-only. Nothing is deleted unless you run clean, purge or uninstall and confirm.</tspan></tspan>
<tspan x="20" y="148"><tspan fill="#3a96dd" font-weight="bold">Disk</tspan></tspan>
<tspan x="20" y="166"><tspan fill="#767676">------------------------------------------------------------</tspan></tspan>
<tspan x="20" y="184">  C: (system drive)</tspan>
<tspan x="20" y="202">    Capacity             475.8 GB</tspan>
<tspan x="20" y="220">    Used                 412.3 GB   <tspan fill="#c19c00">[#########################.....]</tspan> 86%</tspan>
<tspan x="20" y="238">    Free                 <tspan fill="#cccccc" font-weight="bold">63.5 GB</tspan></tspan>
<tspan x="20" y="256">  D: Data</tspan>
<tspan x="20" y="274">    Capacity             931.5 GB</tspan>
<tspan x="20" y="292">    Used                 288.1 GB   <tspan fill="#13a10e">[#########.....................]</tspan> 30%</tspan>
<tspan x="20" y="310">    Free                 <tspan fill="#cccccc" font-weight="bold">643.4 GB</tspan></tspan>
<tspan x="20" y="346"><tspan fill="#3a96dd" font-weight="bold">Memory (RAM)</tspan></tspan>
<tspan x="20" y="364"><tspan fill="#767676">------------------------------------------------------------</tspan></tspan>
<tspan x="20" y="382">  Physical memory        16.0 GB</tspan>
<tspan x="20" y="400">  In use                 10.9 GB    <tspan fill="#13a10e">[####################..........]</tspan> 68%</tspan>
<tspan x="20" y="418">    Compressed           1.4 GB</tspan>
<tspan x="20" y="436">  Cached                 4.2 GB <tspan fill="#767676">(freed instantly when apps need it)</tspan></tspan>
<tspan x="20" y="454">  Available              5.1 GB</tspan>
<tspan x="20" y="472">  Committed              14.6 GB of 34.9 GB <tspan fill="#767676">(41%, RAM + page file)</tspan></tspan>
<tspan x="20" y="490">  Page file used         1.1 GB of 18.9 GB</tspan>
<tspan x="20" y="508">  Memory pressure        <tspan fill="#13a10e">Normal</tspan> <tspan fill="#767676">(31% available)</tspan></tspan>
<tspan x="20" y="544">  <tspan fill="#cccccc" font-weight="bold">Top apps by memory</tspan> <tspan fill="#767676">(working set, approximate)</tspan></tspan>
<tspan x="20" y="562">    2.7 GB     chrome <tspan fill="#767676">(31 processes)</tspan></tspan>
<tspan x="20" y="580">    1.4 GB     Memory Compression</tspan>
<tspan x="20" y="598">    1.3 GB     Code <tspan fill="#767676">(11 processes)</tspan></tspan>
<tspan x="20" y="616">    1.1 GB     svchost <tspan fill="#767676">(94 processes)</tspan></tspan>
<tspan x="20" y="634">    986 MB     ms-teams <tspan fill="#767676">(4 processes)</tspan></tspan>
<tspan x="20" y="652">    604 MB     explorer</tspan>
<tspan x="20" y="670">    433 MB     Discord <tspan fill="#767676">(6 processes)</tspan></tspan>
<tspan x="20" y="688">    388 MB     OneDrive</tspan>
<tspan x="20" y="706">  <tspan fill="#767676">High "in use" memory is normal. Only memory pressure tells you if RAM is a problem.</tspan></tspan>
<tspan x="20" y="742"><tspan fill="#3a96dd" font-weight="bold">Space hogs</tspan></tspan>
<tspan x="20" y="760"><tspan fill="#767676">------------------------------------------------------------</tspan></tspan>
<tspan x="20" y="778">  <tspan fill="#767676">SIZE       SAFETY   WHAT</tspan></tspan>
<tspan x="20" y="796">  41.2 GB    <tspan fill="#c50f1f">REVIEW </tspan>  <tspan fill="#cccccc" font-weight="bold">WSL Linux distros</tspan></tspan>
<tspan x="20" y="814">                      <tspan fill="#767676">Your Linux files. 'wsl --unregister &lt;name&gt;' removes an unused distro and everything in it.</tspan></tspan>
<tspan x="20" y="832">                      <tspan fill="#767676">~\AppData\Local\Packages\CanonicalGroupLimited.Ubuntu_79rhkp1fndgsc\LocalState\ext4.vhdx</tspan></tspan>
<tspan x="20" y="850">  12.6 GB    <tspan fill="#13a10e">SAFE   </tspan>  <tspan fill="#cccccc" font-weight="bold">Browser caches (Chrome, Edge, Brave, Firefox)</tspan></tspan>
<tspan x="20" y="868">                      <tspan fill="#767676">Web page caches. Close the browser before cleaning.</tspan></tspan>
<tspan x="20" y="886">                      <tspan fill="#767676">~\AppData\Local\Google\Chrome\User Data\Default\Cache</tspan></tspan>
<tspan x="20" y="904">  8.4 GB     <tspan fill="#13a10e">SAFE   </tspan>  <tspan fill="#cccccc" font-weight="bold">Temporary files</tspan></tspan>
<tspan x="20" y="922">                      <tspan fill="#767676">Leftovers from installers and apps. Files still in use are skipped.</tspan></tspan>
<tspan x="20" y="940">                      <tspan fill="#767676">~\AppData\Local\Temp</tspan></tspan>
<tspan x="20" y="958">  6.9 GB     <tspan fill="#c19c00">CAUTION</tspan>  <tspan fill="#cccccc" font-weight="bold">Docker Desktop data</tspan></tspan>
<tspan x="20" y="976">                      <tspan fill="#767676">Clean runs 'docker system prune': stopped containers, dangling images, build cache. Volumes are kept.</tspan></tspan>
<tspan x="20" y="994">                      <tspan fill="#767676">~\AppData\Local\Docker\wsl</tspan></tspan>
<tspan x="20" y="1012">  3.8 GB     <tspan fill="#c50f1f">REVIEW </tspan>  <tspan fill="#cccccc" font-weight="bold">Downloads folder</tspan></tspan>
<tspan x="20" y="1030">                      <tspan fill="#767676">Your files. Sort by size in Explorer and remove what you no longer need.</tspan></tspan>
<tspan x="20" y="1048">                      <tspan fill="#767676">~\Downloads</tspan></tspan>
<tspan x="20" y="1066">  2.2 GB     <tspan fill="#13a10e">SAFE   </tspan>  <tspan fill="#cccccc" font-weight="bold">npm cache</tspan></tspan>
<tspan x="20" y="1084">                      <tspan fill="#767676">Packages are downloaded again when needed.</tspan></tspan>
<tspan x="20" y="1102">                      <tspan fill="#767676">~\AppData\Local\npm-cache</tspan></tspan>
<tspan x="20" y="1120">  1.7 GB     <tspan fill="#c19c00">CAUTION</tspan>  <tspan fill="#cccccc" font-weight="bold">Installer files (9 .msi/.iso/setup.exe)</tspan></tspan>
<tspan x="20" y="1138">                      <tspan fill="#767676">Rarely needed after installing. Clean moves them to the Recycle Bin, so it can be undone.</tspan></tspan>
<tspan x="20" y="1156">                      <tspan fill="#767676">.</tspan></tspan>
<tspan x="20" y="1174">  <tspan fill="#767676">Run as administrator to also measure system caches (Windows Update, crash dumps, Windows.old).</tspan></tspan>
<tspan x="20" y="1210"><tspan fill="#3a96dd" font-weight="bold">Delete commands</tspan></tspan>
<tspan x="20" y="1228"><tspan fill="#767676">------------------------------------------------------------</tspan></tspan>
<tspan x="20" y="1246">  <tspan fill="#767676">Prefer 'medic clean': it asks first and only touches allowlisted folders.</tspan></tspan>
<tspan x="20" y="1264">  <tspan fill="#767676">To clean by hand, close the related apps and copy the commands under an item.</tspan></tspan>
<tspan x="20" y="1300">  <tspan fill="#767676">Paste this helper once per PowerShell window. It empties a folder without following links:</tspan></tspan>
<tspan x="20" y="1318">    function Clear-Folder($Path) { Get-ChildItem -LiteralPath $Path -Force -ErrorAction SilentlyContinue | ForEach-Object {</tspan>
<tspan x="20" y="1336"> if ($_.PSIsContainer -and ($_.Attributes -band [IO.FileAttributes]::ReparsePoint)) { cmd /c rd "$($_.FullName)" } elseif (</tspan>
<tspan x="20" y="1354">$_.PSIsContainer) { cmd /c rd /s /q "$($_.FullName)" 2&gt;$null } else { Remove-Item -LiteralPath $_.FullName -Force -ErrorAct</tspan>
<tspan x="20" y="1372">ion SilentlyContinue } } }</tspan>
<tspan x="20" y="1408">  <tspan fill="#13a10e">SAFE   </tspan>  <tspan fill="#cccccc" font-weight="bold">Browser caches (Chrome, Edge, Brave, Firefox)</tspan> <tspan fill="#767676">(12.6 GB)</tspan></tspan>
<tspan x="20" y="1426">    Clear-Folder "$env:LOCALAPPDATA\Google\Chrome\User Data\Default\Cache"</tspan>
<tspan x="20" y="1444">    Clear-Folder "$env:LOCALAPPDATA\Google\Chrome\User Data\Default\Code Cache"</tspan>
<tspan x="20" y="1462">    Clear-Folder "$env:LOCALAPPDATA\Microsoft\Edge\User Data\Default\Cache"</tspan>
<tspan x="20" y="1498">  <tspan fill="#13a10e">SAFE   </tspan>  <tspan fill="#cccccc" font-weight="bold">Temporary files</tspan> <tspan fill="#767676">(8.4 GB)</tspan></tspan>
<tspan x="20" y="1516">    Clear-Folder "$env:LOCALAPPDATA\Temp"</tspan>
<tspan x="20" y="1552">  <tspan fill="#c19c00">CAUTION</tspan>  <tspan fill="#cccccc" font-weight="bold">Docker Desktop data</tspan> <tspan fill="#767676">(6.9 GB)</tspan></tspan>
<tspan x="20" y="1570">    docker system prune --force</tspan>
<tspan x="20" y="1606">  <tspan fill="#13a10e">SAFE   </tspan>  <tspan fill="#cccccc" font-weight="bold">npm cache</tspan> <tspan fill="#767676">(2.2 GB)</tspan></tspan>
<tspan x="20" y="1624">    npm cache clean --force</tspan>
<tspan x="20" y="1660"><tspan fill="#3a96dd" font-weight="bold">Managed by Windows (do not delete by hand)</tspan></tspan>
<tspan x="20" y="1678"><tspan fill="#767676">------------------------------------------------------------</tspan></tspan>
<tspan x="20" y="1696">  C:\pagefile.sys        18.9 GB</tspan>
<tspan x="20" y="1714">  C:\hiberfil.sys        6.4 GB</tspan>
<tspan x="20" y="1732">  WinSxS                 Windows component store</tspan>
<tspan x="20" y="1750">  <tspan fill="#767676">Looks huge in Explorer because of hard links. Never delete it by hand; as admin, run</tspan></tspan>
<tspan x="20" y="1768">  <tspan fill="#767676">'Dism /Online /Cleanup-Image /StartComponentCleanup' to trim old versions.</tspan></tspan>
<tspan x="20" y="1786">  Restore points         System Protection</tspan>
<tspan x="20" y="1804">  <tspan fill="#767676">Manage their size in Control Panel &gt; System &gt; System Protection &gt; Configure.</tspan></tspan>
<tspan x="20" y="1822">  Storage Sense          Settings &gt; System &gt; Storage</tspan>
<tspan x="20" y="1840">  <tspan fill="#767676">Can empty temp files and the Recycle Bin for you on a schedule.</tspan></tspan>
<tspan x="20" y="1876"><tspan fill="#3a96dd" font-weight="bold">Summary</tspan></tspan>
<tspan x="20" y="1894"><tspan fill="#767676">------------------------------------------------------------</tspan></tspan>
<tspan x="20" y="1912">  <tspan fill="#13a10e">SAFE   </tspan>  <tspan fill="#cccccc" font-weight="bold">23.2 GB   </tspan> regenerated automatically, no data loss</tspan>
<tspan x="20" y="1930">  <tspan fill="#c19c00">CAUTION</tspan>  <tspan fill="#cccccc" font-weight="bold">8.6 GB    </tspan> regenerable, read the note first</tspan>
<tspan x="20" y="1948">  <tspan fill="#c50f1f">REVIEW </tspan>  <tspan fill="#cccccc" font-weight="bold">45.0 GB   </tspan> your data, check by hand (never cleaned by medic)</tspan>
<tspan x="20" y="1984">  Run <tspan fill="#cccccc" font-weight="bold">medic clean</tspan> to pick SAFE and CAUTION items to clean,</tspan>
<tspan x="20" y="2002">  or <tspan fill="#cccccc" font-weight="bold">medic clean --dry-run</tspan> to preview without changing anything.</tspan>
</text></svg>
